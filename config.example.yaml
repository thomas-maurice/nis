# NIS configuration. Every key here is read by the running server.
# Anything not listed here is not a recognised option — older revisions of
# this file documented keys (database.path, jetstream_defaults, etc.) that the
# binary never reads.
#
# Precedence (high → low): explicit flag > env var > this file > built-in default.
# Env vars use SCREAMING_SNAKE_CASE with dots replaced by underscores —
# `database.dsn` becomes `DATABASE_DSN`, `auth.jwt_secret` becomes `AUTH_JWT_SECRET`.

server:
  address: ":8080"     # listen address, host:port
  enable_ui: true      # serve the embedded Vue UI at /

database:
  driver: "sqlite"     # "sqlite" or "postgres"
  # SQLite: a filesystem path. Postgres: a libpq DSN.
  #   sqlite:   ./nis.db
  #   postgres: host=localhost port=5432 user=nis password=... dbname=nis sslmode=disable
  dsn: "./nis.db"
  auto_migrate: true   # apply embedded Goose migrations on startup; turn OFF in prod

encryption:
  # Two ways to configure encryption. Use ONE of these, not both:
  #
  # (1) Multi-key (recommended for prod — supports key rotation). Each key is a
  #     32-byte secret, base64 encoded. Generate one with:
  #       openssl rand -base64 32
  current_key_id: "key-2025-01"
  keys:
    - id: "key-2025-01"
      key: "REPLACE_WITH_GENERATED_KEY"
    # Old key kept around so previously-encrypted data is still decryptable:
    # - id: "key-2024-12"
    #   key: "OLD_KEY_BASE64"
  #
  # (2) Single key (simple). Comment out the keys: block above and uncomment:
  # key: "REPLACE_WITH_32_BYTE_KEY"     # raw 32 bytes, not base64
  # key_id: "default"                   # arbitrary ID for this key

auth:
  # Minimum 32 bytes recommended. Also settable via --jwt-secret or AUTH_JWT_SECRET.
  jwt_secret: "REPLACE_WITH_SECURE_JWT_SECRET_MIN_32_BYTES"
  jwt_ttl: "24h"

metrics:
  enabled: true        # exposes Prometheus /metrics and records OTel metrics

tracing:
  enabled: false                       # OTLP/gRPC exporter; off until a collector is reachable
  endpoint: "localhost:4317"           # collector host:port
  insecure: true                       # disable TLS for the OTLP connection
  sample_ratio: 1.0                    # ParentBased(TraceIDRatio) sampler in [0, 1]
  service_name: "nis"                  # service.name resource attribute

log_level: "info"      # debug, info, warn, error

# --- Key rotation workflow (encryption.keys) ---
# 1. Generate a new key:  openssl rand -base64 32
# 2. Append it to `keys:` with a fresh ID
# 3. Update `current_key_id` to point at the new ID
# 4. Restart NIS — new data uses the new key; old data still decrypts via old keys
# 5. Optionally re-encrypt existing data via the rotation API
# 6. Once nothing references the old key, remove it from the list
