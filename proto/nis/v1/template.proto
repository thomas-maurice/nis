syntax = "proto3";

package nis.v1;

option go_package = "github.com/thomas-maurice/nis/gen/nis/v1;nisv1";

import "nis/v1/common.proto";
import "nis/v1/scoped_key.proto";
import "google/protobuf/timestamp.proto";

// Template is an operator-scoped, versioned bundle of NATS subject
// permissions. SSKs reference templates by (template_id, version_number);
// the SSK's pub/sub columns are a snapshot — JWT-regen reads the columns,
// not the template. Templates make "the same ServiceReader role across 50
// accounts" expressible once with an explicit bump path for rollouts.
message Template {
  string id = 1;
  string operator_id = 2;
  string name = 3;
  string description = 4;
  int32 latest_version = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

// TemplateVersion is an immutable snapshot of a template's permissions at
// a point in time. New versions are created on UpdateTemplate when the
// permission bytes change; description-only edits do NOT bump the version.
message TemplateVersion {
  string id = 1;
  string template_id = 2;
  int32 version_number = 3;
  UserPermissions permissions = 4;
  ResponsePermission response_permission = 5;
  string change_note = 6;
  google.protobuf.Timestamp created_at = 7;
  // Nullable: the api_user that created this version. Set NULL on user
  // deletion so offboarding doesn't break audit history.
  string created_by_user_id = 8;
}

message CreateTemplateRequest {
  string operator_id = 1;
  string name = 2;
  string description = 3;
  UserPermissions permissions = 4;
  ResponsePermission response_permission = 5;
  // Optional note attached to the initial v1 row.
  string change_note = 6;
}

message CreateTemplateResponse {
  Template template = 1;
  TemplateVersion version = 2;
}

message GetTemplateRequest {
  string id = 1;
  // Optional. When 0 or unset, returns the latest version alongside the
  // template; when set, returns that specific version (404 if missing).
  int32 version_number = 2;
}

message GetTemplateResponse {
  Template template = 1;
  TemplateVersion version = 2;
}

message GetTemplateByNameRequest {
  string operator_id = 1;
  string name = 2;
  int32 version_number = 3;
}

message GetTemplateByNameResponse {
  Template template = 1;
  TemplateVersion version = 2;
}

message ListTemplatesRequest {
  string operator_id = 1;
  ListOptions options = 2;
}

message ListTemplatesResponse {
  repeated Template templates = 1;
}

message UpdateTemplateRequest {
  string id = 1;
  optional string description = 2;
  // When set, creates a new template_versions row and bumps latest_version.
  // When unset, the call is a description-only edit.
  UserPermissions permissions = 3;
  ResponsePermission response_permission = 4;
  string change_note = 5;
}

message UpdateTemplateResponse {
  Template template = 1;
  // Set when this call created a new version; unset for description-only
  // edits.
  TemplateVersion version = 2;
}

message DeleteTemplateRequest {
  string id = 1;
}

message DeleteTemplateResponse {}

message ListTemplateVersionsRequest {
  string template_id = 1;
}

message ListTemplateVersionsResponse {
  repeated TemplateVersion versions = 1;
}

message ListTemplateDependentsRequest {
  string template_id = 1;
}

message ListTemplateDependentsResponse {
  // Pinned SSKs across all accounts under the operator. UI surfaces this
  // before a delete attempt or a bulk-bump action.
  repeated ScopedSigningKeyRef dependents = 1;
}

// ScopedSigningKeyRef is a thin denormalized view of a templated SSK; the
// full ScopedSigningKey shape lives in scoped_key.proto. Inlined here so
// the dependents list can show "account / key / current pinned version /
// drifted?" without an extra round-trip per row.
message ScopedSigningKeyRef {
  string scoped_signing_key_id = 1;
  string account_id = 2;
  string account_name = 3;
  string scoped_signing_key_name = 4;
  int32 pinned_version = 5;
  bool drifted = 6;
}

// ApplyTemplateToScopedKeyRequest snapshots a template version into an
// SSK's permission columns, sets template_version on the SSK, clears the
// drifted flag, regenerates the parent account JWT, and pushes to every
// attached cluster post-commit. When version_number is 0, applies the
// template's current latest_version.
message ApplyTemplateToScopedKeyRequest {
  string scoped_signing_key_id = 1;
  int32 version_number = 2;
}

message ApplyTemplateToScopedKeyResponse {
  ScopedSigningKey key = 1;
}

service TemplateService {
  rpc CreateTemplate(CreateTemplateRequest) returns (CreateTemplateResponse);
  rpc GetTemplate(GetTemplateRequest) returns (GetTemplateResponse);
  rpc GetTemplateByName(GetTemplateByNameRequest) returns (GetTemplateByNameResponse);
  rpc ListTemplates(ListTemplatesRequest) returns (ListTemplatesResponse);
  rpc UpdateTemplate(UpdateTemplateRequest) returns (UpdateTemplateResponse);
  rpc DeleteTemplate(DeleteTemplateRequest) returns (DeleteTemplateResponse);
  rpc ListTemplateVersions(ListTemplateVersionsRequest) returns (ListTemplateVersionsResponse);
  rpc ListTemplateDependents(ListTemplateDependentsRequest) returns (ListTemplateDependentsResponse);
  rpc ApplyTemplateToScopedKey(ApplyTemplateToScopedKeyRequest) returns (ApplyTemplateToScopedKeyResponse);
}

