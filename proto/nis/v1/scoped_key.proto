syntax = "proto3";

package nis.v1;

option go_package = "github.com/thomas-maurice/nis/gen/nis/v1;nisv1";

import "nis/v1/common.proto";
import "google/protobuf/timestamp.proto";

// ScopedSigningKey represents a scoped signing key for account-level user signing
message ScopedSigningKey {
  string id = 1;
  string account_id = 2;
  string name = 3;
  string description = 4;
  string public_key = 5;
  UserPermissions permissions = 6;
  ResponsePermission response_permission = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  // Template ref (both empty/zero or both set; enforced by a CHECK on the
  // underlying table). When set, the SSK was created or bumped from
  // templates[template_id]@template_version. The pub/sub fields above are
  // a snapshot of that version at bump time.
  string template_id = 10;
  int32 template_version = 11;
  // Set true when the SSK's pub/sub fields were edited directly since the
  // last bump. Surfaced in the UI as an "edited" badge.
  bool template_drifted = 12;
  // When true, TemplateService.UpdateTemplate auto-applies new versions of
  // the bound template to this SSK (regen account JWT + push to clusters)
  // without operator action. Only valid when template_id is set AND
  // template_drifted is false. Direct edits via UpdatePermissions are
  // rejected while this is true so an auto-apply can't silently
  // overwrite operator changes.
  bool track_latest = 13;
  // Marks SSKs whose parent account JWT lists the key as a raw string
  // in signing_keys (not a UserScope). NSC imports populate this from
  // the source account JWT shape. On regen NIS emits these as plain
  // strings; on user-mint NIS skips SetScoped so NATS uses the user
  // JWT's own perms (matching the operator's pre-NIS expectations).
  // Read-only — flipped by the importer, not by an RPC.
  bool is_plain_signer = 14;
}

// CreateScopedSigningKeyRequest is the request to create a new scoped signing key
message CreateScopedSigningKeyRequest {
  string account_id = 1;
  string name = 2;
  string description = 3;
  UserPermissions permissions = 4;
  ResponsePermission response_permission = 5;
  // Optional template ref. When set, the SSK is created from the named
  // template's permissions (snapshotted into the pub/sub fields) and the
  // permissions+response_permission fields above are ignored. When
  // template_version is 0 with template_name set, applies the template's
  // current latest_version.
  TemplateRef template = 6;
  // Opt the new SSK into TemplateService.UpdateTemplate's auto-apply.
  // Only honoured when `template` is also set; ignored otherwise. The
  // SSK starts at the template's latest version regardless of any
  // version_number pin, because pinning + tracking-latest contradict.
  bool track_latest = 7;
}

// TemplateRef names a template by (operator_id, name) plus optional
// version pin. operator_id is derivable from account_id at the service
// layer but required here so the service can short-circuit without a
// double lookup.
message TemplateRef {
  string operator_id = 1;
  string template_name = 2;
  int32 version_number = 3;
}

// CreateScopedSigningKeyResponse is the response from creating a scoped signing key
message CreateScopedSigningKeyResponse {
  ScopedSigningKey key = 1;
}

// GetScopedSigningKeyRequest is the request to get a scoped signing key by ID
message GetScopedSigningKeyRequest {
  string id = 1;
}

// GetScopedSigningKeyResponse is the response from getting a scoped signing key
message GetScopedSigningKeyResponse {
  ScopedSigningKey key = 1;
}

// GetScopedSigningKeyByNameRequest is the request to get a scoped signing key by name
message GetScopedSigningKeyByNameRequest {
  string account_id = 1;
  string name = 2;
}

// GetScopedSigningKeyByNameResponse is the response from getting a scoped signing key by name
message GetScopedSigningKeyByNameResponse {
  ScopedSigningKey key = 1;
}

// ListScopedSigningKeysRequest is the request to list scoped signing keys
message ListScopedSigningKeysRequest {
  string account_id = 1;
  ListOptions options = 2;
}

// ListScopedSigningKeysResponse is the response from listing scoped signing keys
message ListScopedSigningKeysResponse {
  repeated ScopedSigningKey keys = 1;
}

// UpdateScopedSigningKeyRequest is the request to update a scoped signing key
message UpdateScopedSigningKeyRequest {
  string id = 1;
  optional string name = 2;
  optional string description = 3;
}

// UpdateScopedSigningKeyResponse is the response from updating a scoped signing key
message UpdateScopedSigningKeyResponse {
  ScopedSigningKey key = 1;
}

// UpdatePermissionsRequest is the request to update scoped signing key permissions
message UpdatePermissionsRequest {
  string id = 1;
  UserPermissions permissions = 2;
  ResponsePermission response_permission = 3;
}

// UpdatePermissionsResponse is the response from updating permissions
message UpdatePermissionsResponse {
  ScopedSigningKey key = 1;
}

// DeleteScopedSigningKeyRequest is the request to delete a scoped signing key
message DeleteScopedSigningKeyRequest {
  string id = 1;
}

// DeleteScopedSigningKeyResponse is the response from deleting a scoped signing key
message DeleteScopedSigningKeyResponse {}

// DetachFromTemplateRequest clears the template_id / template_version /
// template_drifted fields on the SSK without changing its permission
// columns. After detach, the SSK becomes a standalone key — future
// template updates do not affect it and the UI stops showing it as
// templated. Permission columns retain whatever values they had at
// detach time.
message DetachFromTemplateRequest {
  string id = 1;
}

message DetachFromTemplateResponse {
  ScopedSigningKey key = 1;
}

// SetTrackLatestRequest toggles the track_latest flag on a templated SSK.
// Enabling requires template_id != "" AND template_drifted == false.
// Disabling has no preconditions. Disabling does not detach — operator
// must call DetachFromTemplate separately.
message SetTrackLatestRequest {
  string id = 1;
  bool enabled = 2;
}

message SetTrackLatestResponse {
  ScopedSigningKey key = 1;
}

// ScopedSigningKeyService manages scoped signing keys
service ScopedSigningKeyService {
  rpc CreateScopedSigningKey(CreateScopedSigningKeyRequest) returns (CreateScopedSigningKeyResponse);
  rpc GetScopedSigningKey(GetScopedSigningKeyRequest) returns (GetScopedSigningKeyResponse);
  rpc GetScopedSigningKeyByName(GetScopedSigningKeyByNameRequest) returns (GetScopedSigningKeyByNameResponse);
  rpc ListScopedSigningKeys(ListScopedSigningKeysRequest) returns (ListScopedSigningKeysResponse);
  rpc UpdateScopedSigningKey(UpdateScopedSigningKeyRequest) returns (UpdateScopedSigningKeyResponse);
  rpc UpdatePermissions(UpdatePermissionsRequest) returns (UpdatePermissionsResponse);
  rpc DeleteScopedSigningKey(DeleteScopedSigningKeyRequest) returns (DeleteScopedSigningKeyResponse);
  rpc DetachFromTemplate(DetachFromTemplateRequest) returns (DetachFromTemplateResponse);
  rpc SetTrackLatest(SetTrackLatestRequest) returns (SetTrackLatestResponse);
}
