syntax = "proto3";

package nis.v1;

option go_package = "github.com/thomas-maurice/nis/gen/nis/v1;nisv1";

import "nis/v1/common.proto";
import "google/protobuf/timestamp.proto";

// User represents a NATS user
message User {
  string id = 1;
  string account_id = 2;
  string name = 3;
  string description = 4;
  string public_key = 5;
  string jwt = 6;
  string scoped_signing_key_id = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;

  // JWT lifecycle metadata (P2).
  optional int64 jwt_ttl_seconds = 10;  // per-user override; unset = inherit from operator
  google.protobuf.Timestamp jwt_issued_at = 11;
  google.protobuf.Timestamp jwt_expires_at = 12;
  google.protobuf.Timestamp revoked_at = 13;
  string revocation_reason = 14;
}

// CreateUserRequest is the request to create a new user
message CreateUserRequest {
  string account_id = 1;
  string name = 2;
  string description = 3;
  string scoped_signing_key_id = 4;
}

// CreateUserResponse is the response from creating a user
message CreateUserResponse {
  User user = 1;
}

// GetUserRequest is the request to get a user by ID
message GetUserRequest {
  string id = 1;
}

// GetUserResponse is the response from getting a user
message GetUserResponse {
  User user = 1;
}

// GetUserByNameRequest is the request to get a user by name
message GetUserByNameRequest {
  string account_id = 1;
  string name = 2;
}

// GetUserByNameResponse is the response from getting a user by name
message GetUserByNameResponse {
  User user = 1;
}

// ListUsersRequest is the request to list users
message ListUsersRequest {
  string account_id = 1;
  ListOptions options = 2;
}

// ListUsersResponse is the response from listing users
message ListUsersResponse {
  repeated User users = 1;
}

// UpdateUserRequest is the request to update a user
message UpdateUserRequest {
  string id = 1;
  optional string name = 2;
  optional string description = 3;
  // jwt_ttl_seconds overrides the operator's default user-JWT TTL for this
  // user. Set to 0 to mean "never expire". Omit (unset) to clear the override
  // and inherit the operator default.
  optional int64 jwt_ttl_seconds = 4;
  // clear_jwt_ttl, when true, removes any per-user override regardless of
  // jwt_ttl_seconds. The two-flag shape is because proto3 cannot distinguish
  // "field absent" from "field set to 0" via optional alone when the caller
  // wants to clear an override back to nil rather than to zero.
  bool clear_jwt_ttl = 5;
}

// UpdateUserResponse is the response from updating a user
message UpdateUserResponse {
  User user = 1;
}

// DeleteUserRequest is the request to delete a user
message DeleteUserRequest {
  string id = 1;
}

// DeleteUserResponse is the response from deleting a user
message DeleteUserResponse {}

// GetUserCredentialsRequest is the request to get user credentials
message GetUserCredentialsRequest {
  string id = 1;
}

// GetUserCredentialsResponse is the response from getting user credentials
message GetUserCredentialsResponse {
  string credentials = 1;
}

// RevokeUserRequest is the request to revoke a user. The user row stays put;
// the user's NATS public key gets added to the parent account JWT's
// Revocations map and pushed to the resolver. NATS will reject any user JWT
// signed by this user's key from now on (or until the JWT's exp passes —
// whichever comes first).
message RevokeUserRequest {
  string id = 1;
  string reason = 2;
}

// RevokeUserResponse returns the updated user (with revoked_at set).
message RevokeUserResponse {
  User user = 1;
}

// RegenerateUserCredentialsRequest issues a fresh user JWT, replacing the
// current one. Clears the revoked_at flag if it was set ("reinstate"). The
// new credentials are returned ONCE; the client is responsible for
// distributing the new .creds file to whoever needs it.
message RegenerateUserCredentialsRequest {
  string id = 1;
}

// RegenerateUserCredentialsResponse returns the updated user and the fresh
// .creds file contents.
message RegenerateUserCredentialsResponse {
  User user = 1;
  string credentials = 2;
}

// UserService manages NATS users
service UserService {
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc GetUserByName(GetUserByNameRequest) returns (GetUserByNameResponse);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
  rpc GetUserCredentials(GetUserCredentialsRequest) returns (GetUserCredentialsResponse);
  // RevokeUser revokes the user via the parent account JWT's Revocations map (P2).
  rpc RevokeUser(RevokeUserRequest) returns (RevokeUserResponse);
  // RegenerateUserCredentials issues a fresh user JWT, returning new creds (P2).
  rpc RegenerateUserCredentials(RegenerateUserCredentialsRequest) returns (RegenerateUserCredentialsResponse);
}
