syntax = "proto3";

package nis.v1;

option go_package = "github.com/thomas-maurice/nis/gen/nis/v1;nisv1";

import "nis/v1/common.proto";
import "google/protobuf/timestamp.proto";

// Account represents a NATS account
message Account {
  string id = 1;
  string operator_id = 2;
  string name = 3;
  string description = 4;
  string public_key = 5;
  string jwt = 6;
  JetStreamLimits jetstream_limits = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

// CreateAccountRequest is the request to create a new account
message CreateAccountRequest {
  string operator_id = 1;
  string name = 2;
  string description = 3;
  JetStreamLimits jetstream_limits = 4;
}

// CreateAccountResponse is the response from creating an account
message CreateAccountResponse {
  Account account = 1;
}

// GetAccountRequest is the request to get an account by ID
message GetAccountRequest {
  string id = 1;
}

// GetAccountResponse is the response from getting an account
message GetAccountResponse {
  Account account = 1;
}

// GetAccountByNameRequest is the request to get an account by name
message GetAccountByNameRequest {
  string operator_id = 1;
  string name = 2;
}

// GetAccountByNameResponse is the response from getting an account by name
message GetAccountByNameResponse {
  Account account = 1;
}

// ListAccountsRequest is the request to list accounts
message ListAccountsRequest {
  string operator_id = 1;
  // options is the legacy pagination parameter (kept for back-compat; prefer page).
  ListOptions options = 2;
  // name_like is a case-insensitive substring filter on account name.
  string name_like = 3;
  // page carries keyset-pagination parameters.
  PageRequest page = 4;
}

// ListAccountsResponse is the response from listing accounts
message ListAccountsResponse {
  repeated Account accounts = 1;
  // next_cursor is the cursor for the next page (empty = no more pages).
  string next_cursor = 2;
}

// UpdateAccountRequest is the request to update an account
message UpdateAccountRequest {
  string id = 1;
  optional string name = 2;
  optional string description = 3;
}

// UpdateAccountResponse is the response from updating an account
message UpdateAccountResponse {
  Account account = 1;
}

// UpdateJetStreamLimitsRequest is the request to update JetStream limits
message UpdateJetStreamLimitsRequest {
  string id = 1;
  JetStreamLimits limits = 2;
}

// UpdateJetStreamLimitsResponse is the response from updating JetStream limits
message UpdateJetStreamLimitsResponse {
  Account account = 1;
}

// DeleteAccountRequest is the request to delete an account
message DeleteAccountRequest {
  string id = 1;
}

// DeleteAccountResponse is the response from deleting an account
message DeleteAccountResponse {}

// PushAccountJWTRequest is the request to push account JWT to NATS resolver
message PushAccountJWTRequest {
  string id = 1;
}

// PushAccountJWTResponse is the response from pushing account JWT
message PushAccountJWTResponse {}

// AccountJWTRevocation is one active entry in the parent account JWT's
// NATS-native Revocations map. Surfaced so operators can see what NATS is
// actually rejecting, independent of whether the user row's revoked_at is
// still set (which RegenerateUserCredentials clears).
message AccountJWTRevocation {
  string id = 1;
  string account_id = 2;
  // user_id is empty when the user row has been hard-deleted but the
  // revocation must remain in the account JWT until jwt_exp.
  string user_id = 3;
  // user_name is empty if user_id is empty.
  string user_name = 4;
  string user_public_key = 5;
  google.protobuf.Timestamp revoked_at = 6;
  google.protobuf.Timestamp jwt_exp = 7;
  string reason = 8;
  // user_still_flagged is true if the user row's revoked_at is non-nil.
  // false after RegenerateUserCredentials — the revocation row stays
  // active until jwt_exp regardless.
  bool user_still_flagged = 9;
}

// ListAccountJWTRevocationsRequest lists active revocations for the account.
message ListAccountJWTRevocationsRequest {
  string account_id = 1;
}

// ListAccountJWTRevocationsResponse returns the active revocations.
message ListAccountJWTRevocationsResponse {
  repeated AccountJWTRevocation revocations = 1;
}

// JetStreamProbeStatus is the per-cluster outcome of a live JetStream usage
// query. Returning the status as a field (instead of an RPC-level error) lets
// the UI show partial results when one of an operator's clusters is down.
enum JetStreamProbeStatus {
  JET_STREAM_PROBE_STATUS_UNSPECIFIED = 0;
  // OK: query succeeded; usage is populated.
  JET_STREAM_PROBE_STATUS_OK = 1;
  // UNREACHABLE: dial or system-account request timed out / refused.
  JET_STREAM_PROBE_STATUS_UNREACHABLE = 2;
  // NO_JETSTREAM: cluster responded but JetStream is not enabled for this
  // account on this cluster (response has disabled=true or empty stats).
  JET_STREAM_PROBE_STATUS_NO_JETSTREAM = 3;
  // ACCOUNT_NOT_FOUND: cluster has no record of the account (no JWT pushed,
  // or sync drift).
  JET_STREAM_PROBE_STATUS_ACCOUNT_NOT_FOUND = 4;
  // ERROR: any other failure (malformed response, decode error, etc.).
  JET_STREAM_PROBE_STATUS_ERROR = 5;
  // NOT_ACTIVATED: account's JWT has JetStream enabled, but the cluster has
  // not yet initialised JS state for it. NATS activates per-account JS state
  // lazily on the first client connect or first JS API call. Until then,
  // $SYS.REQ.ACCOUNT.<key>.JSZ returns "account not found" even though the
  // JWT is on the resolver and JS is configured. Usage is reported as zero.
  // To activate: connect once with the account's credentials (e.g.
  // `nats --creds=app.creds rtt`) or publish to a JS subject.
  JET_STREAM_PROBE_STATUS_NOT_ACTIVATED = 6;
}

// JetStreamUsage is the live usage snapshot from one cluster, aggregated
// across all servers in the cluster by the receiving NATS server.
message JetStreamUsage {
  uint64 memory_used = 1;
  uint64 storage_used = 2;
  uint64 reserved_memory = 3;
  uint64 reserved_storage = 4;
  int32 streams = 5;
  int32 consumers = 6;
  uint64 api_total = 7;
  uint64 api_errors = 8;
}

// ClusterJetStreamUsage is the per-cluster result of a live usage query.
message ClusterJetStreamUsage {
  string cluster_id = 1;
  string cluster_name = 2;
  JetStreamProbeStatus status = 3;
  string error_message = 4;
  // usage is set only when status == OK.
  JetStreamUsage usage = 5;
}

// GetAccountJetStreamUsageRequest queries every cluster attached to the
// account's operator and returns per-cluster usage.
message GetAccountJetStreamUsageRequest {
  string account_id = 1;
  // include_unhealthy forces a dial attempt even when the cluster row's
  // health flag is false. Default false; the request will short-circuit
  // unhealthy clusters with UNREACHABLE to avoid paying the dial timeout
  // on every refresh.
  bool include_unhealthy = 2;
}

// GetAccountJetStreamUsageResponse returns per-cluster usage in stable
// cluster-name order.
message GetAccountJetStreamUsageResponse {
  repeated ClusterJetStreamUsage clusters = 1;
}

// AccountService manages NATS accounts
service AccountService {
  rpc CreateAccount(CreateAccountRequest) returns (CreateAccountResponse);
  rpc GetAccount(GetAccountRequest) returns (GetAccountResponse);
  rpc GetAccountByName(GetAccountByNameRequest) returns (GetAccountByNameResponse);
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse);
  rpc UpdateAccount(UpdateAccountRequest) returns (UpdateAccountResponse);
  rpc UpdateJetStreamLimits(UpdateJetStreamLimitsRequest) returns (UpdateJetStreamLimitsResponse);
  rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountResponse);
  rpc PushAccountJWT(PushAccountJWTRequest) returns (PushAccountJWTResponse);
  rpc ListAccountJWTRevocations(ListAccountJWTRevocationsRequest) returns (ListAccountJWTRevocationsResponse);
  rpc GetAccountJetStreamUsage(GetAccountJetStreamUsageRequest) returns (GetAccountJetStreamUsageResponse);
}
