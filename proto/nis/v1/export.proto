syntax = "proto3";

package nis.v1;

option go_package = "github.com/thomas-maurice/nis/gen/nis/v1;nisv1";

import "google/protobuf/timestamp.proto";

// ExportOperatorRequest is the request to export an operator.
//
// Every export carries seed material — either encrypted (default) or
// plaintext. A "metadata-only" mode (public keys + JWTs but no seeds) was
// considered and dropped: it produces an unrecoverable half-restore that
// breaks the first time the server tries to sign anything (regen account
// JWT, mint user creds), and a regenerated seed wouldn't match the JWT's
// already-baked public key anyway.
message ExportOperatorRequest {
  string operator_id = 1;
  // Output encoding. "json" (default if unset) or "yaml".
  string format = 2;
  // DANGER: when true, NKey seeds are decrypted with the server's current
  // encryption key and emitted in plaintext (`seed` field per row) instead
  // of as `encrypted_seed`. The resulting export is equivalent to a
  // plaintext NKey vault — anyone reading the file can mint .creds for
  // every entity.
  //
  // Intended use: disaster-recovery backups that must remain readable after
  // the server's encryption key is lost or rotated incorrectly. On import,
  // plaintext seeds are re-encrypted with the destination server's current
  // key.
  bool plaintext_secrets = 3;
}

// ExportOperatorResponse is the response containing the exported operator data
message ExportOperatorResponse {
  bytes data = 1; // JSON- or YAML-encoded export data (per request format)
  // Echoes back the format actually used, so a client that left format unset
  // can still tell what encoding it got.
  string format = 2;
}

// ImportOperatorRequest is the request to import an operator
message ImportOperatorRequest {
  // JSON- or YAML-encoded export data. Format is auto-detected by peeking at
  // the first non-whitespace byte: '{' or '[' is JSON, anything else is YAML.
  bytes data = 1;
  // When true, if an operator with the same ID already exists, its subtree
  // (accounts, users, scoped signing keys) is replaced atomically with the
  // contents of the export. Clusters under that operator are preserved (they
  // model live NATS infrastructure and are not touched by import). When false
  // (default), import refuses if the operator ID already exists.
  bool overwrite = 2;
}

// ImportOperatorResponse is the response from importing an operator
message ImportOperatorResponse {
  string operator_id = 1; // ID of the imported operator
}

// ImportFromNSCRequest is the request to import an operator from NSC archive
message ImportFromNSCRequest {
  bytes data = 1; // Compressed archive (.zip, .tar.gz, .tar.bz2) of NSC store
  string operator_name = 2; // Name of the operator in NSC
}

// ImportFromNSCResponse is the response from importing from NSC
message ImportFromNSCResponse {
  string operator_id = 1; // ID of the imported operator
}

// ExportService manages operator export and import
service ExportService {
  rpc ExportOperator(ExportOperatorRequest) returns (ExportOperatorResponse);
  rpc ImportOperator(ImportOperatorRequest) returns (ImportOperatorResponse);
  rpc ImportFromNSC(ImportFromNSCRequest) returns (ImportFromNSCResponse);
}
