# Kind: Template
# Declares an operator-scoped, versioned permission bundle. Templates exist to
# eliminate per-account re-typing of common roles ("ServiceReader",
# "MetricsWriter") — a ScopedSigningKey can be created from a template and is
# then pinned to a specific version. Updating the template creates a new
# version row but never auto-rolls dependents; an operator explicitly bumps
# each SSK (via `nisctl signing-key bump-template KEY` or the UI).
#
# Required fields: apiVersion, kind, metadata.name, metadata.operator
# Optional fields: spec.description, spec.changeNote
# spec.account: MUST NOT be set (templates are operator-scoped, not account-scoped)
#
# Reserved names: "default" and "system" are refused.
#
# On apply:
#   - If the template does not exist, version 1 is created with the
#     permissions below.
#   - If it exists, UpdateTemplate is called: description changes update in
#     place, permission changes create a new version row and bump
#     latest_version. SSKs already pinned to an older version stay pinned.
#
# `changeNote` is attached to the new version row when a permission edit
# bumps the version; it's discarded on description-only edits and on
# round-trip dumps.
apiVersion: nis/v1
kind: Template
metadata:
  name: service-reader
  operator: acme-prod
spec:
  description: Read-only service consumer — subscribe to events, no publish
  pubAllow: []
  pubDeny:
    - ">"            # explicit deny everything: no publishing at all
  subAllow:
    - events.>
    - metrics.>
    - _INBOX.>       # required for request/reply
  subDeny: []
  responseMaxMsgs: 0
  responseTTL: 0s
  changeNote: "initial version"
