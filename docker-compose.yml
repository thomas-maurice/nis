services:
  nis:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nis-server
    ports:
      - "8080:8080"
    environment:
      # Generate with: make generate-jwt-secret
      - AUTH_JWT_SECRET=CHANGE_ME_GENERATE_WITH_openssl_rand_base64_32
      # Generate with: make generate-encryption-key
      - ENCRYPTION_KEY=CHANGE_ME_GENERATE_WITH_openssl_rand_base64_32
      - DATABASE_AUTO_MIGRATE=true
      - DATABASE_DSN=/data/nis.db
      # Scheduled backups (P12). Pointed at the local MinIO service below.
      # Each operator must still opt in via `nisctl operator backup enable`;
      # this only flips the NIS-wide kill switch.
      - BACKUPS_ENABLED=true
      - BACKUPS_S3_ENDPOINT=http://minio:9000
      - BACKUPS_S3_BUCKET=nis-backups
      - BACKUPS_S3_ACCESS_KEY_ID=minioadmin
      - BACKUPS_S3_SECRET_ACCESS_KEY=minioadmin
      - BACKUPS_S3_USE_PATH_STYLE=true
      - BACKUPS_S3_USE_SSL=false
    command: ["./nis", "serve", "--address", ":8080"]
    volumes:
      - nis_data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      minio-setup:
        condition: service_completed_successfully
    restart: unless-stopped

  nis-setup:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nis-setup
    environment:
      - DATABASE_DSN=/data/nis.db
    command:
      - sh
      - -c
      - |
        echo "Waiting for NIS server..."
        sleep 10
        echo "Creating admin user..."
        ./nis user create admin --password admin123 --role admin || echo "Admin already exists"
    volumes:
      - nis_data:/data
    depends_on:
      nis:
        condition: service_healthy
    restart: "no"

  nats:
    image: nats:2.10-alpine
    container_name: nis-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["-js", "-m", "8222"]
    volumes:
      - nats_data:/data
    restart: unless-stopped

  # MinIO — S3-compatible object storage for the P12 scheduled-backup
  # feature. The OSS minio/minio repo was archived in April 2026; this
  # image is the last OSS release and is suitable for dev/CI only. For
  # production, point BACKUPS_S3_* at any actively-maintained
  # S3-compatible backend (AWS S3, Backblaze B2, Cloudflare R2,
  # Garage, MinIO AIStor, your own MinIO cluster). The application
  # makes no assumptions beyond the S3 API surface (Put/Get/Head/List/
  # Remove + HeadBucket).
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: nis-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # Bucket bootstrap. Idempotent — `mc mb --ignore-existing` on a
  # bucket that already exists is a no-op. Production setups do
  # bucket creation out-of-band (Terraform, IaC) and NIS will
  # HeadBucket on startup to fail-fast if the bucket is missing.
  minio-setup:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: nis-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin
        mc mb --ignore-existing local/nis-backups
        echo "MinIO bucket ready: local/nis-backups"
    restart: "no"

volumes:
  nis_data:
  nats_data:
  minio_data:
